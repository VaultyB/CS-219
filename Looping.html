<!DOCTYPE html>
<html>
    <title>Looping Practice</title>
    <p id="modelList"></p>

    <script>
        const cars = ["BMW", "Volvo", "Saab", "Ford"];
        let len = cars.length;

        let text = "";
        for (let i=0; i<len; i++){
            text += cars[i] + "<hr>";
        }

        let i = 0;
        while (i<10){
            document.write(i+ "<br>");
            i++;
            if(i===4){
                
            }
        }
        for (let i=0;i<5;){
            document.write(i+ "<br>");
            i++;
        }
        for (let i=0;;i++){
            if (i===5){
                break;
            }
            document.write(i+"<br>");
        }
        document.getElementById("modelList").innerHTML = text;
        /*Do-while
        do {
        some function
        }
        while(condition)*/

    </script>
</html>
