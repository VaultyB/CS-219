<!DOCTYPE html>
<html>
    <title>Module 6_1</title>
    <p id="driver"></p>
    <p id="greeting"></p>
    <p id="day"></p>
    <p id="boolT"></p>
    <p id="bootF"></p>
    <body>
        <script>
            let age = 15;
            let text = "You can not drive :()";

            if (age >= 15){
                text="You can drive!";
            }

            document.getElementById("driver").innerHTML= text;


            const time = new Date().getHours();
            let greeting;
            if (time <10){
                greeting = "Good Morning"
            }
            else if (time < 20){
                greeting = "Good day";
            }
            else{
                greeting = "Good morning";
            }
            document.getElementById("greeting").innerHTML= greeting;


            let day;
            let date = new Date().getDay();

            switch (date) {
                case 0:
                    day = "Sunday";
                    break;
                case 1:
                    day = "Monday";
                    break;
                case 2:
                    day = "Tuesday";
                    break;
                case 3:
                    day = "Wednesday";
                    break;
                case 4:
                    day = "Thursday";
                    break;
                case 5:
                    day = "Friday";
                    break;
                case 6:
                    day = "Saturday"
                    break;
            }
            document.getElementById("day").innerHTML=day;


            document.getElementById("boolT").innerHTML=!(5===8);
            document.getElementById("boolF").innerHTML=(5===8);
        </script>
    </body>
</html>
